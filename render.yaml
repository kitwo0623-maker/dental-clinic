services:
  - type: web
    name: dental-clinic
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dental-clinic-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: dental-clinic-db
    plan: free
