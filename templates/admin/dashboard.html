{% extends "admin/base_admin.html" %}
{% block title %}ダッシュボード - キトウ歯科医院{% endblock %}
{% block page_title %}ダッシュボード{% endblock %}
{% block content %}

<!-- Stats Cards -->
<div class="row g-4 mb-4">
  <div class="col-md-3">
    <div class="card border-0 shadow-sm">
      <div class="card-body d-flex align-items-center">
        <div class="rounded-circle bg-primary bg-opacity-10 p-3 me-3">
          <i class="fas fa-users text-primary fs-4"></i>
        </div>
        <div>
          <div class="text-muted small">総患者数</div>
          <div class="fw-bold fs-4">{{ total_patients }}</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- クイックアクション -->
<div class="row g-4">
  <div class="col-lg-4">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white border-0">
        <h6 class="fw-bold mb-0"><i class="fas fa-bolt text-warning me-2"></i>クイックアクション</h6>
      </div>
      <div class="card-body d-grid gap-2">
        <a href="{{ url_for('patient_new') }}" class="btn btn-outline-primary text-start">
          <i class="fas fa-user-plus me-2"></i>新患登録
        </a>
<a href="{{ url_for('patients_list') }}" class="btn btn-outline-secondary text-start">
          <i class="fas fa-search me-2"></i>患者検索
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
