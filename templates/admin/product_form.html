{% extends "admin/base_admin.html" %}
{% block title %}{{ '商品編集' if product else '商品追加' }}{% endblock %}
{% block page_title %}{{ '商品情報編集' if product else '新規商品登録' }}{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm">
  <div class="card-body p-4">
    <form method="post">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label fw-semibold">商品名 <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" value="{{ product.name if product else '' }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">カテゴリ</label>
          <input type="text" name="category" class="form-control" list="categoryList"
            value="{{ product.category if product else '' }}" placeholder="例：オーラルケア、サプリ">
          <datalist id="categoryList">
            {% for c in ['オーラルケア', 'ホワイトニング', 'サプリメント', '矯正用品', 'その他'] %}
            <option value="{{ c }}">
            {% endfor %}
          </datalist>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">価格（円） <span class="text-danger">*</span></label>
          <input type="number" name="price" class="form-control" value="{{ product.price if product else 0 }}" min="0" required>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">在庫数</label>
          <input type="number" name="stock" class="form-control" value="{{ product.stock if product else 0 }}" min="0">
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">商品説明</label>
          <textarea name="description" class="form-control" rows="3">{{ product.description if product else '' }}</textarea>
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">画像URL</label>
          <input type="url" name="image_url" class="form-control" value="{{ product.image_url if product else '' }}"
            placeholder="https://example.com/image.jpg">
        </div>
        <div class="col-12">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" name="is_active" id="isActive"
              {{ 'checked' if not product or product.is_active }}>
            <label class="form-check-label fw-semibold" for="isActive">公開する</label>
          </div>
        </div>
        <div class="col-12 d-flex gap-2">
          <button type="submit" class="btn btn-primary px-4">
            <i class="fas fa-save me-2"></i>{{ '更新する' if product else '登録する' }}
          </button>
          <a href="{{ url_for('products_admin') }}" class="btn btn-outline-secondary">キャンセル</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
