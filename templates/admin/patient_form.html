{% extends "admin/base_admin.html" %}
{% block title %}{{ '患者編集' if patient else '新規患者登録' }}{% endblock %}
{% block page_title %}{{ '患者情報編集' if patient else '新規患者登録' }}{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm">
  <div class="card-body p-4">
    <form method="post">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">氏名 <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" value="{{ patient.name if patient else '' }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">フリガナ</label>
          <input type="text" name="name_kana" class="form-control" value="{{ patient.name_kana if patient else '' }}" placeholder="ヤマダ タロウ">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">生年月日</label>
          <input type="date" name="birth_date" class="form-control" value="{{ patient.birth_date.isoformat() if patient and patient.birth_date else '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">性別</label>
          <select name="gender" class="form-select">
            <option value="">選択</option>
            <option value="男性" {{ 'selected' if patient and patient.gender == '男性' }}>男性</option>
            <option value="女性" {{ 'selected' if patient and patient.gender == '女性' }}>女性</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">電話番号</label>
          <input type="tel" name="phone" class="form-control" value="{{ patient.phone if patient else '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">メールアドレス</label>
          <input type="email" name="email" class="form-control" value="{{ patient.email if patient else '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">住所</label>
          <input type="text" name="address" class="form-control" value="{{ patient.address if patient else '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">保険種別</label>
          <select name="insurance_type" class="form-select">
            <option value="">選択</option>
            {% for t in ['社会保険', '国民健康保険', '後期高齢者医療', '自費', 'その他'] %}
            <option value="{{ t }}" {{ 'selected' if patient and patient.insurance_type == t }}>{{ t }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">保険証番号</label>
          <input type="text" name="insurance_number" class="form-control" value="{{ patient.insurance_number if patient else '' }}">
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">アレルギー・禁忌</label>
          <input type="text" name="allergies" class="form-control" value="{{ patient.allergies if patient else '' }}" placeholder="例：ペニシリン、金属アレルギー">
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">備考</label>
          <textarea name="notes" class="form-control" rows="3">{{ patient.notes if patient else '' }}</textarea>
        </div>
        <div class="col-12 d-flex gap-2">
          <button type="submit" class="btn btn-primary px-4">
            <i class="fas fa-save me-2"></i>{{ '更新する' if patient else '登録する' }}
          </button>
          <a href="{{ url_for('patients_list') }}" class="btn btn-outline-secondary">キャンセル</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
